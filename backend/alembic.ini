# Azztec_SaaS_alembic_ini_v1_0_0.ini  ->  backend/alembic.ini
# Version: 1.0.0 · 2026-09-14 · Adriaan
# Spec:    Azztec_SaaS_S1j_KT_Uplift_Chunk_Spec_v1_0_0.md §3.1 (OD-43)
# Changelog: 1.0.0 initial - S1j. No sqlalchemy.url here: env.py builds it from Settings (WORKMATE_*).
#
# Run from backend/:  uv run alembic upgrade head --sql   (offline render = DRY_RUN, read it first)
#                     uv run alembic upgrade head         (the real run, as svc_workmate)
#                     uv run alembic current
# Never `alembic revision --autogenerate` (CLAUDE.md rule 5). 0001 is generated by scripts/kt_uplift_ddl.py.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s
